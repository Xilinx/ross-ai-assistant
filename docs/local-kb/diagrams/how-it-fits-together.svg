<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#ffffff"/>

  <!-- Row 1: You ask -->
  <rect x="90" y="16" width="380" height="42" rx="8" fill="#dfe9f5" stroke="#14396b" stroke-width="1.5"/>
  <text x="280" y="43" text-anchor="middle" font-size="15" font-weight="600" fill="#0b2545">You ask a question</text>

  <line x1="280" y1="58" x2="280" y2="82" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Row 2: Client + LLM (collapsed) -->
  <rect x="90" y="88" width="380" height="58" rx="8" fill="#eaf2fb" stroke="#1a4480" stroke-width="1.5"/>
  <text x="280" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2545">AI Client → LLM</text>
  <text x="280" y="135" text-anchor="middle" font-size="12" fill="#3a5e8a">LLM decides to call the doc-search tool</text>

  <line x1="280" y1="146" x2="280" y2="170" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Row 3: MCP Server -->
  <rect x="90" y="176" width="380" height="42" rx="8" fill="#fdf1e0" stroke="#8a5a12" stroke-width="1.5"/>
  <text x="280" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#5c3b0a">MCP Server → queries Weaviate</text>

  <line x1="280" y1="218" x2="280" y2="242" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Row 4: Weaviate (full width, the main target of MCP) -->
  <rect x="90" y="248" width="380" height="58" rx="8" fill="#e3f0e6" stroke="#1e5c33" stroke-width="1.5"/>
  <text x="280" y="274" text-anchor="middle" font-size="14" font-weight="600" fill="#173d24">Weaviate</text>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#3a6b47">Hybrid keyword + vector search over the corpus</text>

  <!-- Side box: llama.cpp (attached to right edge of Weaviate) -->
  <rect x="488" y="252" width="60" height="50" rx="6" fill="#efe9fb" stroke="#4b2e83" stroke-width="1.5"/>
  <text x="518" y="273" text-anchor="middle" font-size="11" font-weight="600" fill="#2e1a5c">llama</text>
  <text x="518" y="287" text-anchor="middle" font-size="11" font-weight="600" fill="#2e1a5c">.cpp</text>

  <!-- Weaviate ↔ llama.cpp arrows -->
  <line x1="470" y1="268" x2="488" y2="268" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <line x1="488" y1="286" x2="470" y2="286" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arrowD)"/>

  <!-- Return: passages back up -->
  <line x1="280" y1="306" x2="280" y2="330" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" font-style="italic" fill="#33424f">passages</text>

  <!-- Row 5: MCP returns to LLM -->
  <rect x="90" y="336" width="380" height="42" rx="8" fill="#fdf1e0" stroke="#8a5a12" stroke-width="1.5"/>
  <text x="280" y="363" text-anchor="middle" font-size="14" font-weight="600" fill="#5c3b0a">MCP Server → returns passages to LLM</text>

  <line x1="280" y1="378" x2="280" y2="402" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Row 6: LLM answers → You -->
  <rect x="90" y="408" width="380" height="42" rx="8" fill="#dfe9f5" stroke="#14396b" stroke-width="1.5"/>
  <text x="280" y="435" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2545">LLM writes a grounded answer → You</text>
</svg>
