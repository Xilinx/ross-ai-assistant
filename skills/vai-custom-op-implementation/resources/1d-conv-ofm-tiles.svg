<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 275" width="810" height="413">
  <defs>
    <marker id="t-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 Z" fill="#2E7D32"/></marker>
    <marker id="t-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/></marker>
    <marker id="l-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 Z" fill="#2E7D32"/></marker>
    <marker id="l-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/></marker>
    <marker id="w-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 Z" fill="#6A1B9A"/></marker>
    <marker id="w-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6A1B9A"/></marker>
  </defs>
  <rect width="540" height="275" fill="white"/>

  <text x="270" y="18" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#424242">OFM partitioned into output tiles of width T</text>

  <text x="130" y="34" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" font-style="italic" fill="#6A1B9A">T + k - 1</text>

  <g id="window-ruler" stroke="#6A1B9A" fill="none">
    <line x1="68" y1="38" x2="68" y2="56" stroke-width="1"/>
    <line x1="192" y1="38" x2="192" y2="56" stroke-width="1"/>
    <line x1="68" y1="41" x2="192" y2="41" stroke-width="1.2" marker-start="url(#w-start)" marker-end="url(#w-end)"/>
  </g>

  <!-- IFM strip (atop OFM) -->
  <text x="60" y="72" text-anchor="end" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#616161">IFM</text>
  <g id="ifm-strip">
    <rect x="70" y="56" width="100" height="30" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2" rx="2"/>
    <rect x="170" y="56" width="100" height="30" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2" rx="2"/>
    <rect x="270" y="56" width="100" height="30" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2" rx="2"/>
    <rect x="370" y="56" width="100" height="30" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2" rx="2"/>
    <!-- k-1 overlap regions consumed by the previous tile -->
    <rect x="170" y="56" width="20" height="30" fill="#AA00FF" opacity="0.18" stroke="none"/>
    <rect x="270" y="56" width="20" height="30" fill="#AA00FF" opacity="0.18" stroke="none"/>
    <rect x="370" y="56" width="20" height="30" fill="#AA00FF" opacity="0.18" stroke="none"/>
    <text x="120" y="73" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="8" fill="#0D47A1">in[T*i..]</text>
    <text x="220" y="73" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="8" fill="#0D47A1">(+T)</text>
    <text x="320" y="73" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="8" fill="#0D47A1">(+T)</text>
    <text x="420" y="73" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="8" fill="#0D47A1">(+T)</text>
  </g>

  <!-- Overlapping IFM window for OFM tile i -->
  <rect x="68" y="54" width="124" height="34" fill="none" stroke="#6A1B9A" stroke-width="2" rx="3" stroke-dasharray="5,3"/>

  <!-- OFM strip -->
  <text x="60" y="122" text-anchor="end" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#616161">OFM</text>
  <g id="ofm-lane">
    <rect x="70" y="106" width="100" height="30" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2" rx="2"/>
    <rect x="170" y="106" width="100" height="30" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2" rx="2"/>
    <rect x="270" y="106" width="100" height="30" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2" rx="2"/>
    <rect x="370" y="106" width="100" height="30" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.2" rx="2"/>
    <text x="120" y="124" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="9" fill="#1B5E20">tile i</text>
    <text x="220" y="124" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="9" fill="#1B5E20">i+1</text>
    <text x="320" y="124" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="9" fill="#1B5E20">i+2</text>
    <text x="420" y="124" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="9" fill="#1B5E20">i+3</text>
  </g>

  <!-- T ruler below tile i -->
  <g id="t-ruler" stroke="#2E7D32" fill="none">
    <line x1="70" y1="142" x2="70" y2="160" stroke-width="1"/>
    <line x1="170" y1="142" x2="170" y2="160" stroke-width="1"/>
    <line x1="70" y1="155" x2="170" y2="155" stroke-width="1.2" marker-start="url(#t-start)" marker-end="url(#t-end)"/>
  </g>
  <text x="120" y="176" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" font-style="italic" fill="#1B5E20">T</text>

  <!-- L_out bracket spanning all tiles -->
  <g id="lout-ruler" stroke="#2E7D32" fill="none">
    <line x1="70" y1="185" x2="70" y2="203" stroke-width="1"/>
    <line x1="470" y1="185" x2="470" y2="203" stroke-width="1"/>
    <line x1="70" y1="198" x2="470" y2="198" stroke-width="1.2" marker-start="url(#l-start)" marker-end="url(#l-end)"/>
  </g>
  <text x="270" y="219" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" font-style="italic" fill="#1B5E20">L<tspan font-size="9" baseline-shift="sub">out</tspan></text>

  <!-- Legend -->
  <line x1="70" y1="241" x2="84" y2="241" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="90" y="245" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6A1B9A">IFM window read by one OFM tile</text>
  <rect x="70" y="252" width="14" height="10" fill="#AA00FF" opacity="0.18" stroke="none"/>
  <text x="90" y="261" font-family="Inter,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6A1B9A">k - 1 overlap shared with the previous tile's IFM window</text>
</svg>
