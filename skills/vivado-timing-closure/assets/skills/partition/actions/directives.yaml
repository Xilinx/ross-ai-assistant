# Partition Skill - Available Directives and Actions

partition_directives:
  spread_logic_high:
    stage: place
    command: "place_design -directive SSI_SpreadLogic_high"
    description: "Aggressive SLR balancing"
    use_when: "High utilization imbalance, need to spread across SLRs"

  spread_logic_low:
    stage: place
    command: "place_design -directive SSI_SpreadLogic_low"
    description: "Moderate SLR balancing"
    use_when: "Moderate imbalance, preserve locality"

# XDC template patterns
partition_xdc_templates:
  assign_module_to_slr:
    template: "add_cells_to_pblock [get_pblocks SLR{slr_id}] [get_cells {module_path}]"
    description: "Assign a hierarchical module to a specific SLR"

  create_slr_pblock:
    template: |
      create_pblock pblock_SLR{slr_id}
      resize_pblock pblock_SLR{slr_id} -add CLOCKREGION_S{slr_id}X0Y0:CLOCKREGION_S{slr_id}X8Y6
      add_cells_to_pblock [get_pblocks pblock_SLR{slr_id}] [get_cells {module_path}]
    description: "Create SLR pblock and assign module"
