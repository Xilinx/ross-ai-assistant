  description: Comprehensive AIE kernel development guide covering architecture-level
    optimization techniques, result analysis, and compiler-independent patterns. Covers
    loop splitting for register pressure, in-place updates, signedness optimization,
    VLIW slot awareness, result analysis (disassembly, DM maps, calltree, profiling),
    and general kernel coding practices. Ships aie_api_references.md, the detailed
    AIE API primitive catalog (per-dtype support, vectorization, accumulator types,
    math-pattern to API lookup). For Peano compiler-specific pragmas, loop hints,
    software pipelining details, and optimization remarks, see the vai-aie-compiler-oriented-optimizations
    skill.
  version: 6.3.0
  stage: beta
  content_sha256: ea787ba411ba7a3d64618f574722b3cd6cbc25d6b895244086284253b17ac6de
- name: vai-custom-op
  path: skills/vai-custom-op
  description: Orchestrate multi-agent parallel development of multiple custom AIE
    operators for VAIML. Handles workspace partitioning, spawning worker agents, relaying
    insights between workers, gating integration on verified results, and serializing
    the final model stitching. Use when developing 2+ custom ops in parallel, when
    coordinating multi-agent custom op work, or when integrating multiple validated
    custom ops into a single model.
  version: 6.3.0
  stage: beta
  content_sha256: 5983b69e4fa9eeea5cbc5873982161538ad92f476d420c8a879626867a0cd2a1
- name: vai-custom-op-candidates
  path: skills/vai-custom-op-candidates
  description: Find customOperator optimization chains and their ONNX node boundaries
  version: 6.3.0
  stage: beta
  content_sha256: 7d3ac633c92b9fd4c8ba0bf710dcf25db8f567e6f382166165a430b8339d3eb9
- name: vai-custom-op-implementation
  path: skills/vai-custom-op-implementation
  description: 'End-to-end custom AIE operator development for VAIML: extract a subgraph
    from an ONNX model, develop a custom kernel and tiling, validate with x86sim against
    a CPU reference, and re-integrate the custom op back into the full model. Use
    when the user wants to create a custom op, write a kernel, define tiling, compile
    for AIE, simulate with x86sim, or integrate a custom op into a model.'
  version: 6.3.0
  stage: beta
  content_sha256: 0cf9cd212e78bfd3cf365fa98f8dc153d4b4de7ff0ee0a4e6e1d3b38683969f1
- name: vai-dequantize-model
  path: skills/vai-dequantize-model
  description: Strip quantization from an ONNX model to produce a non-quantized (float)
    version suitable for re-quantization. Removes QDQ pairs, Extended QDQ operators,
    and BFP quantization nodes while preserving the computational graph structure.
    Supports legacy QDQ (vint8), Extended QDQ (EQDQ/bf16/fp16), and MX6/BFP quantization.
  version: 6.3.0
  stage: beta
  content_sha256: 9c0e0d9d2e8e066710ab8c7224e46506d127ae85bc2ce215a3a720ae0fd7b1a6
- name: vai-fe-args
  path: skills/vai-fe-args
  description: Determine the correct fe_args and vaiml_config flags for a mixed-precision
    ONNX model based on its quantization pattern. Analyzes model structure to identify
    island topology, quantization types, and required compiler features. Targets single
    NPU partition (embedded Telluride scenario).
  version: 6.3.0
  stage: beta
  content_sha256: b26b0e70b829bccda85c562dc9991d8168111da9640c8d892f32f9fe49111591
- name: vai-ffn-quantization
  path: skills/vai-ffn-quantization
  description: 'Identify and quantize Feed-Forward Network (FFN) layers in ONNX models.
    An FFN is any MatMul+Add (weight+bias) linear layer: MLP projections, attention
    QKV projections, attention output projections, and classifier heads. This skill
    detects all FFN patterns, groups them into blocks, and applies per-layer INT8
    quantization.'
  version: 6.3.0
  stage: beta
  content_sha256: f425ec681e252aff1271493f7856142d33fbc6e23df769c9cc9c853b8e169ed4
- name: vai-flag-configuration
  path: skills/vai-flag-configuration
  description: Iteratively improve the VAIML compilation configuration for an ONNX
    model. Analyzes the model and the flag catalog, proposes a non-default vitisai_config.json,
    compiles it, validates NPU offload (and board inference time when available),
    and loops until the user's stop condition is met. Use when the user wants to tune
    compiler flags, improve NPU offloading, or reduce inference time for a model.
  version: 6.3.0
  stage: beta
  content_sha256: b1cc0676c552dac8c5edceb8ff454d15661a2d0d06c02a00ac03a95edecda600
- name: vai-partition-analysis
  path: skills/vai-partition-analysis
  description: Inspect the result of a VAIML compilation of a mixed-precision ONNX
    model and reduce the number of NPU partitions toward a single partition. Parses
    the compiler operation statistics (matched kernels / templated graphs), the partition
    count, and the AIE/CPU offload split; when more than one partition is produced,
    reads the CpuBecause messages and compilation warnings, classifies them, and proposes
    remediation. Remediation prefers the correct frontend (fe_args) flags over model
    patching; when the partition break originates from quantization, it proposes Quark
    configuration changes instead. Every proposed change is followed by a re-compilation
    to evaluate the result.
  version: 6.3.0
  stage: beta
  content_sha256: eebb4d6e06a6e20f8850564dc07d324c067ebea87d5bbca7db0271994597e8b2
- name: vai-peak-bandwidth-analysis
  path: skills/vai-peak-bandwidth-analysis
  description: From L3 DDR DMA-channel profiling, judge compute- vs memory-bound execution
    and recommend tiling / QoS changes, focused on the channels and operators with
    the most backpressure/starvation stall
  version: 6.3.0
  stage: beta
  content_sha256: 304e834975083796e097809dcee335766a1abf58248b70109c73a07bf28c5957
- name: vai-perf-analysis
  path: skills/vai-perf-analysis
  description: Analyze performance of VAIML compiled models. Uses the AI Analyzer
    SDK to extract detailed timing, operator metrics, and performance summaries, then
    answers any question about model performance -- layer timing, custom op cost,
    bottlenecks, partition breakdown, comparisons between runs, and more. Requires
    a Ryzen AI / Vitis AI Python environment with `dlanalyzer` available -- either
    by sourcing a venv activate script (`--t`) or by running inside a pre-provisioned
    environment such as the official Vitis AI Docker container. Use when the user
    wants to analyze model performance, find slow layers, compare compilation runs,
    understand custom op overhead, or generate a performance report.
  version: 6.3.0
  stage: beta
  content_sha256: 5218224fc3ea9fa21be1c2003d8bff4a0f029f849c7892ecc3e77d5d6c09c133
- name: vai-quantization-guide
  path: skills/vai-quantization-guide
  description: Master orchestrator for mixed-precision ONNX model quantization targeting
    AMD NPU (Strix/Telluride). Guides users through quantization strategy selection,
    accuracy validation, compiler flag configuration, and board execution. Supports
    full bf16, full vint8, hybrid BF16/VINT8 configurations, and edge quantization
    in runtime. Specialized quantization methods are provided as optional plugin skills
    discovered at runtime.
  version: 6.3.0
  stage: beta
  content_sha256: 6c3c892090e7cdecf0b7ef76ce9e2430cdc769b8c5686dabe79dd2d5de0b0a7c
- name: vitis-aie
  path: skills/vitis-aie
  description: Create and build a Vitis AI Engine (AIE) component/graph — inside the
    Vitis Unified IDE's AI agent via the `runVitisPython` tool against the live `client`,
    or HEADLESS on any host via `vitis -s`. Use whenever the user asks to create or
    build an AIE / AI Engine component, kernel, or graph (from a shipped example or
    custom sources); a missing `runVitisPython` tool is never a reason to decline
    — detect the mode and continue headless. Create-only by default; the build (`comp.build(target=x86sim|hw)`)
    runs only when the user asks. Running the simulators (`x86simulator` / `aiesimulator`)
    is out of scope for this skill.
  version: 1.0.6
  stage: beta
  content_sha256: 0f32dee37bceb7319df546a82ec213dc34c8d1e105e8d56aeb8d2d1301b639b0
- name: vitis-aie-int8-mac
  path: skills/vitis-aie-int8-mac
  description: Configure the AIE int8xint8 vector MAC intrinsics (mul8/mac8, mul16/mac16)
    for a target algorithm. Use when choosing or debugging xstart/xoffsets/xstep/xsquare
    and zstart/zoffsets/zstep/zsquare, when a lane is reading the wrong buffer element,
    when deciding between mul8 and mul16, when mapping a FIR/beamformer/matrix operation
    onto AIE int8 MACs, or when an aiecompiler "must be a multiple of" chess_error
    appears. AIE only - these intrinsics do not exist on AIE-ML or AIE-MLv2. Not for
    the `aie::mul`/`aie::mac` API or other AIE API questions.
  version: 1.0.1
  stage: beta
  content_sha256: 91892ad98e0c2b1b0122bbb370a1a394d3691bc9d6f6a333f0f8211833b03599
- name: vitis-aie-profile
  path: skills/vitis-aie-profile
  description: 'Guides AIE profiling and event trace from compile time to runtime
    on Versal / AI Engine designs. Covers counters-vs-trace decisions, v++ event-trace
    flags, trace compile-failure recovery, and xrt.ini [AIE_profile_settings] and
    [AIE_trace_settings] for tile-scoped capture. Answers questions like "What is
    the latency of my AIE kernel?", "Where and when are my data transfers stalling?",
    "What is the average throughput/bandwidth on my PLIO or GMIO port?", and "Are
    my AIE kernels overlapping in time?" Interprets aie_profile.csv, aie_trace outputs,
    and Vitis Analyzer timelines. For PL or host-only profiling, use vitis-pl-profile
    or vitis-host-profile. Load it before answering even if it seems familiar: it
    holds version-checked metric names and documented stall fixes general knowledge
    gets wrong. Not for general Vitis work without a profiling or trace question (e.g.
    HLS or ADF code, SD-card images, platforms). The Versal `v++ --package` step is
    in scope when the xclbin must carry AIE profile or trace metadata.'
  version: 1.0.1
  stage: beta
  content_sha256: 3fbf4803f4618578275cec754f145e734e84c6cef97bb3f727b96ea9406faaed
- name: vitis-aie-simulation
  path: skills/vitis-aie-simulation
  description: 'Runs aiesimulator on an already-compiled AIE (AI Engine) hw build
    (Work directory): gathers and checks inputs, launches aiesimulator, compares against
    golden files, and reports the outcome. Simulation only; it does not compile the
    graph. Use when the user wants to simulate a compiled AIE graph in a Vitis/Versal
    flow.

    '
  version: 1.2.0
  stage: beta
  content_sha256: c5dbf46d20ea64819b43eb27413b6c06b3ca79741af854e6963086a0cc4bd9f4
- name: vitis-classic-migration
  path: skills/vitis-classic-migration
  description: Migrates Vitis Classic 2023.2, 2024.1 and 2024.2 embedded workspaces
    and XSCT Tcl project scripts to Vitis Unified IDE 2026.2 components that build
    and debug, with no Classic IDE or XSCT needed afterwards. Carries over embedded
    platforms (XSA, domains, BSP libraries and user-set BSP parameters), user edits
    to BSP source files (drivers, libraries, OS) via a local software repository,
    embedded apps with their C/C++ build settings and sources, and system projects.
    Reports every unsupported setting with guidance, and verifies the result setting
    by setting (verify_migration.py) plus a build and a launch.json debug-readiness
    check. Accelerated projects are reported as not supported. Use when the user mentions
    Vitis Classic, `vitis --classic`, XSCT scripts (setws, platform create, app create,
    bsp config), "Export Workspace to Unified IDE", migrate.py, .sdkproject/.prj/.sprj/platform.spr
    files, or asks to migrate, port, convert or upgrade an old Vitis/SDK project to
    the Unified IDE.
  version: 1.4.0
  stage: beta
  content_sha256: b51005564715af3e72c7ad71db12419148743afc4a39ab1bf282775a7a4159a0
- name: vitis-create-aie-kernel
  path: skills/vitis-create-aie-kernel
  description: 'Write a new AI Engine (AIE) kernel and its ADF graph from a plain-English
    description: kernel header and source with a vectorized AIE API implementation,
    aie.cfg, floorplan constraints, graph, test application and Makefile, then build,
    check in x86sim against a golden model and self-review against UG1079 coding practice.
    Covers single- and multi-kernel graphs (pipelines, cascade, tiled matrix multiply,
    widget chains) for AIE (VCK190) and AIE-ML (VEK280). Also creates or updates any
    one of those files on its own. Use for custom AIE functionality, not for instantiating
    DSP Library IP.'
  version: 1.0.0
  stage: beta
  content_sha256: 2fad5baa7ef731fc1e503e1d473e8ff4e23f64f4ae989e7eb24a15773e6994cc
- name: vitis-embedded
  path: skills/vitis-embedded
  description: Build the Vitis embedded software lifecycle end to end — create an
    embedded hardware platform, create a standalone/FreeRTOS/Linux application on
    that platform, and package a bootable image (BOOT.BIN / PDI via Bootgen). Works
    INSIDE the Vitis Unified IDE's AI agent via the `runVitisPython` tool against
    the live `client`, or HEADLESS on any host via `vitis -s` (the boot image is a
    Bootgen shell step). Use whenever the user asks to create an embedded platform,
    create an embedded app on a built platform, or create/generate a boot image /
    BOOT.BIN / PDI; a missing `runVitisPython` tool is never a reason to decline —
    detect the mode and continue headless. Each step is create-only by default; build/package
    runs only when the user asks. Load the reference for the step in play — `references/platform.md`,
    `references/app.md`, or `references/boot-image.md`.
  version: 1.1.0
  stage: beta
  content_sha256: 23d66deab4076cc0ea645c7924275d7565b7e643b76dacef924378e11c37c278
- name: vitis-functional-sim
  path: skills/vitis-functional-sim
  description: 'Generate Python, MATLAB or C++ functional verification test scripts
    for AMD Versal hardware implementations using VFS (Vitis Functional Simulation).
    Supports HLS kernels, AI Engine graphs (including packet switching), LogiCORE
    IPs (xFFT, FIR Compiler), Versal RF Hard IPs (vrfFFT, vrfChannelizer, vrfADC,
    vrfDAC), Poly Block IPs (pbChannelizer, pbArbResampler), the Versal LDPC decoder
    (versalLDPC), and multi-component chained pipelines. Use when: user wants to functionally
    verify their implementation, build a test framework, simulate their kernel in
    Python/MATLAB/C++, compare against a reference model, create a VFS testbench,
    or functionally simulate their design. VFS is functional x86 simulation. For cycle-approximate
    PLIO handshaking between PL kernels and an AI Engine graph with an RTL testbench,
    use Vitis Subsystem Simulation instead.'
  version: 1.0.0
  stage: beta
  content_sha256: af69f5bee459728139a349aa5415148a993928e0fa82340a7d01022cc025b599
- name: vitis-hardware-emulation
  path: skills/vitis-hardware-emulation
  description: 'Runs hardware emulation (hw_emu) on an already-built Versal AIE +
    PL design: gathers inputs, runs pre-emulation DRC checks, stages the QEMU boot
    image and the run artifacts, launches the QEMU-based emulation, and reports the
    outcome. Emulation only; it does not compile, link, package, or cross-compile
    anything. Invoke with /vitis-hardware-emulation [path/to/hwemu_inputs.md]. The
    optional argument is a filled inputs file (see scripts/hwemu_inputs.template.md)
    for a non-interactive run; omit it to be prompted.

    '
  version: 3.0.0
  stage: beta
  content_sha256: ace6ad1c1cbb1b7af1bca44b5355778f82f9938c7ceb58a7b75db1fb7b8667b6
- name: vitis-host-profile
  path: skills/vitis-host-profile
  description: 'Guides host-side XDP profiling via xrt.ini [Debug] flags (opencl_trace,
    native_xrt_trace, lop_trace, host_trace) and interpretation of host trace CSVs
    (native_trace.csv, opencl_trace.csv, user_events.csv). Inspects host code to select
    the correct API-family trace flags and answers performance questions from profiling
    output. Use when users ask about host-to-device transfer time (H2D/D2H), kernel
    parallel execution, or host/device pipelining and idle time. For PL kernel instrumentation
    or AIE tile profiling, use vitis-pl-profile or vitis-aie-profile instead. Load
    it before answering even if the answer seems familiar: it holds version-checked
    flag names and guardrails that general knowledge gets wrong. Not for general Vitis
    development without a profiling or trace question (e.g. writing HLS or ADF code,
    packaging, creating platforms).'
  version: 1.0.0
  stage: beta
  content_sha256: e525084e658ae2c9b07b5f1c6533ed560c36f5fa38c4715037e80dcc2b7af9ae
- name: vitis-pl-profile
  path: skills/vitis-pl-profile
  description: 'Guides PL profiling and trace from compile time through runtime on
    Vitis / XRT designs. Covers v++ --profile.data, --profile.exec, --profile.stall,
    and --profile.trace_memory to instrument xclbin debug_ip_layout, xrt.ini device_trace
    and stall_trace flags, and interpretation of device_trace CSVs and summary.csv.
    Answers questions such as "Can the pipelining between my PL kernels work better?",
    "Are my PL kernels receiving and sending the right amount of data?", or "My system
    is hanging, which PL kernel could be the problem?" Inspects xclbin via xclbinutil
    before recommending runtime ini. For AIE or host-only profiling, use vitis-aie-profile
    or vitis-host-profile instead. Load it before answering even if the answer seems
    familiar: it holds version-checked option names, hw vs hw_emu rules, and documented
    stall resolutions that general knowledge gets wrong. Not for general Vitis development
    without a profiling or trace question (e.g. writing HLS or ADF code, packaging,
    creating platforms).'
  version: 1.0.0
  stage: beta
  content_sha256: 4cf04ef8ba2ea38f8b1b191318e428a547411a2557cb3b6aa55a9e80838f98db
- name: vitis-platform
  path: skills/vitis-platform
  description: Annotate an open, validated Vivado block design with Vitis platform
    (PFM) properties. Discover and set PFM.CLOCK, PFM.AXI_PORT, PFM.IRQ and PFM.AXIS_PORT
    with the ::vitis::pfm commands, and set the platform identity. Use for "add PFM
    properties", "annotate this block design for Vitis" or "make this block design
    a Vitis platform". It does not build or change the design and does not export
    the XSA.
  version: 1.1.0
  stage: beta
  content_sha256: df7d31c7a9edc848521ee0ca98a390d0a47e6f3c19eeb34b46c012cc14b4e79d
- name: vitis-system
  path: skills/vitis-system
  description: Compose a Vitis system — V++ link AIE + HLS components into a fixed
    XSA/VMA/VSS (the integration step), then package the binary containers into a
    deployable image such as an SD-card image, BOOT.BIN, or XCLBIN (the system step).
    Works INSIDE the Vitis Unified IDE's AI agent via the `runVitisPython` tool against
    the live `client`, or HEADLESS on any host via `vitis -s`. Use whenever the user
    asks to create an integration or system project, V++ link kernels to the AI Engine,
    wire AIE + HLS components together, or produce/package a deployable image. Compose-only
    by default; the V++ link and the build+package run only when the user asks. Load
    the reference for the step in play — `references/integration.md` (link) or `references/system.md`
    (package).
  version: 1.0.12
  stage: beta
  content_sha256: 5b9109e86ae88c951fdc05dafc543c154adec95e021ac1723defb5cd331c9b9e
- name: vitis-vss-simulation
  path: skills/vitis-vss-simulation
  description: 'A skill to help running VSS (Vitis Subsystem) simulation for AIE +
    PL designs. Invoke with /vitis-vss-simulation [path/to/vss_inputs.md]. The optional
    argument is a filled inputs file (see scripts/vss_inputs.template.md) for a non-interactive
    run; omit it to be prompted.

    '
  version: 1.3.0
  stage: beta
  content_sha256: a6b142a0cfa8dc779187d68fd0f73bc9bb9a0ea4002e1c16fd8c41afcbcd5c1d
- name: vivado-ced-configurator
  path: skills/vivado-ced-configurator
  description: Find and configure a Vivado Configurable Example Design (CED) from
    the live XilinxCEDStore for a natural-language request, in two phases with user
    approval before IP-level changes. Use when the user asks for an example design,
    preset or reference design on a board or part (Zynq, MPSoC, MicroBlaze, Versal,
    Kria, PCIe/CPM, DMA, extensible platform), optionally with settings inside it.
  version: 1.1.0
  stage: beta
  content_sha256: c4e89ab86d0069d64da0efec08848e09bf50f5d89219796a207b5dec60328f0e
- name: vivado-convert-flat-to-dfx
  path: skills/vivado-convert-flat-to-dfx
  description: 'Convert a flat Vivado design to a DFX-ready project for a supported
    UltraScale+ or Versal part. The user supplies only the module instance name(s);
    detect Project/Non-Project mode, exact part/family, and whether each selected
    module is RTL or BD/BDC. Validate RP boundaries, convert selected modules, create
    the required DFX configuration structure, migrate timing and physical constraints
    into new static/RM-scoped XDCs without modifying source XDCs, and for Versal convert
    affected Modular NoC paths to an INI boundary and validate ownership. Do not create
    pblocks, implement, or run pr_verify. Use when asked to convert a flat Vivado
    design to DFX.

    '
  version: 1.0.0
  stage: beta
  content_sha256: 5f0a41785370b8f0fdfa015e65a341e7ef550e978ba2b344dcd87e88336e78bb
- name: vivado-ip-configurator
  path: skills/vivado-ip-configurator
  description: Use for any request to add, insert, instantiate, create, configure,
    customize, modify, change, enable, disable, update or set parameters of a Vivado
    IP core or block-design cell, even when this skill is not named and even when
    the request says to use the Vivado MCP directly - including AXI GPIO, UART Lite/16550,
    timer, IIC, SPI, interrupt controller, BRAM controller and embedded memory, FIFOs,
    MicroBlaze and MicroBlaze V, Zynq and Versal processing systems (CIPS, PS Wizard),
    clocking wizards, resets, NoC and DDR/LPDDR memory controllers, DMA/CDMA, SmartConnect
    and interconnects, MIPI, video, ISP, VCU and AI Engine IP. Load it before the
    first Vivado tool call; it drives Vivado through the MCP itself, so configuring
    the IP with hand-written Tcl skips its legal-value reads and verification. Works
    one cell per prompt in an open block design, so a design can be built up over
    many prompts.
  version: 1.0.3
  stage: beta
  content_sha256: dcdecfc49e4cc064479df794c662122d6d6578b5bf9a60af39571cd0e4ea0112
- name: vivado-ipi-assembler
  path: skills/vivado-ipi-assembler
  description: 'Use this skill to ASSEMBLE a full Vivado IP-Integrator block design
    from a system specification — not just configure one IP, but create + configure
    MULTIPLE cells and then CONNECT them, build clock/reset domains, assign the address
    map, and validate the result. Trigger whenever the user wants to "build the block
    design", "assemble the system", "wire up the IPs", "stand up the Versal design",
    turn a spec/diagram/manifest into a working BD, or connect/clock/address/validate
    an existing multi-cell design. This skill depends on and orchestrates the vivado-ip-configurator
    skill (ipcfg::*) for the per-cell work and adds the assembly layer (ipiasm::*).
    It is AUTOMATION-FIRST: apply_bd_automation is always tried before manual wiring.

    '
  version: 1.0.0
  stage: beta
  content_sha256: 8216785a36f8c45bd560e80acd3a9ab26d1589b3f472a91196f9dab22d257e36
- name: vivado-netlist-debug-insert
  path: skills/vivado-netlist-debug-insert
  description: Insert ILA debug cores into an open synthesized Vivado design on the
    nets the user names, check that the capture memory (block RAM) fits the device,
    and report what it inserted. It picks each core's clock from the signals and keeps
    the default capture depth of 1024 samples unless the user names one; with a design
    open it lists marked nets, top-level modules, clocks and debug cores, not every
    net. It saves only to a path the user names, and runs no opt_design, place or
    route of its own. Versal DFX designs are handled per configuration; UltraScale+
    DFX designs are handled on Vivado 2026.2 when no debug exists yet, else get a
    blocker report. It also gives read-only advice on ILA timing in a routed design.
    Use when asked to add an ILA post-synthesis, how ILA insertion works or what to
    give it, instrument a checkpoint, probe nets or registers on a DCP, or insert
    debug cores into the netlist without editing RTL. Does not insert VIO, JTAG-to-AXI
    Master, IBERT or System ILA.
  version: 1.0.1
  stage: beta
  content_sha256: 221e684c8f46698df3cc8eebd8b081eb69604f1527b4b6168297cddb3b7937a6
- name: vivado-revision-control
  path: skills/vivado-revision-control
  description: 'Comprehensive Vivado project revision control strategies for standard,
    DFX (Partial Reconfiguration), IPI Block Design Container, and Segmented Configuration
    projects. Includes automated tools for project type detection, source analysis,
    settings capture, and build script generation. Use this skill whenever the user
    mentions version control, Git, build scripts, project portability, team collaboration,
    CI/CD for Vivado, exporting sources, preparing a project for handoff, or recreating
    projects — even if they don''t explicitly say "revision control". Also trigger
